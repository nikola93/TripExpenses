# Production stack: Postgres, the backend and the nginx-served frontend.
# For development with hot reload use docker-compose.dev.yml.
services:
  db:
    image: postgres:17
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB (copy .docker.env.example).
    env_file:
      - ./.docker.env
    ports:
      # host:container. 5435 on the host avoids a native Postgres on 5432
      # and other projects' databases.
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    # DATABASE_URL pointing at the db service.
    env_file:
      - ./.docker.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "1604:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
