services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tripexpenses
      POSTGRES_PASSWORD: tripexpenses
      POSTGRES_DB: tripexpenses
    ports:
      # host:container. 5434 on the host avoids a native Postgres on 5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripexpenses -d tripexpenses"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "host=db user=tripexpenses password=tripexpenses dbname=tripexpenses port=5432 sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # `docker compose watch` rebuilds and restarts the backend on code changes.
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - bin/

  frontend:
    build: ./frontend
    ports:
      - "1604:80"
    depends_on:
      - backend
    restart: unless-stopped
    # `docker compose watch` rebuilds the static bundle on code changes.
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

  # Vite dev server with hot module reload, only started with the "dev" profile:
  #   docker compose --profile dev watch
  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: "http://backend:8080"
    ports:
      # 1605 on the host so it can run next to the nginx frontend on 1604.
      - "1605:1604"
    depends_on:
      - backend
    develop:
      watch:
        # Source edits are copied into the container; Vite hot-reloads them.
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        # Dependency or config changes need a fresh image.
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/vite.config.ts

volumes:
  pgdata:
