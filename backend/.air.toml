# Air hot reload config, used by dev.Dockerfile (and `air` run natively).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  kill_delay = "1s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
